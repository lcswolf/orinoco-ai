[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/orinoco-supervisord.pid

[program:ollama]
command=/usr/local/bin/orinoco-ollama-start
directory=/home/container
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:model-init]
command=/usr/local/bin/orinoco-model-init
directory=/home/container
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:orinoco-web]
command=/usr/local/bin/orinoco-web-start
directory=/home/container
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backup-scheduler]
command=python -m orinoco.backup_scheduler
directory=/home/container
priority=40
autostart=true
autorestart=unexpected
startsecs=0
startretries=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
