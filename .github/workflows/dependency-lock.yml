name: Compile Python dependency locks

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/dependency-lock.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/dependency-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-verify:
    name: Compile and verify hash-locked Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install lock compiler
        run: python -m pip install pip-tools==7.7.0
      - name: Compile runtime and development locks
        run: |
          pip-compile --generate-hashes --resolver=backtracking --output-file=requirements.lock requirements.txt
          pip-compile --generate-hashes --resolver=backtracking --output-file=requirements-dev.lock requirements-dev.txt
      - name: Verify runtime lock can be installed with hashes
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify development lock can be installed with hashes
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock
      - name: Commit verified lock files on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock
          if git diff --cached --quiet; then
            echo "Dependency locks are already up to date."
          else
            git commit -m "Update hash-locked Python dependencies"
            git push
          fi
      - name: Upload compiled lock files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-locks
          path: |
            requirements.lock
            requirements-dev.lock
          if-no-files-found: error
          retention-days: 7
