name: Publish Orinoco container image

on:
  # Publishing is deliberately manual. A passing PR build never publishes an image.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: orinoco-ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Orinoco to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable and stable tags
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/lcswolf/orinoco-ai:stable
            ghcr.io/lcswolf/orinoco-ai:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lcswolf/orinoco-ai
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
