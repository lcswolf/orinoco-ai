name: Container build

on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "deploy/**"
      - "orinoco/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "docker/**"
      - "deploy/**"
      - "orinoco/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: orinoco-container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 40
    name: Build and smoke-test Orinoco container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Validate shell scripts
        run: for script in docker/*.sh; do sh -n "$script"; done

      - name: Validate Caddy and Nginx proxy templates
        shell: bash
        run: |
          set -uo pipefail
          caddy_log="$RUNNER_TEMP/caddy-validation.log"
          nginx_log="$RUNNER_TEMP/nginx-validation.log"

          docker run --rm \
            --env ACME_EMAIL=ops@example.net \
            --env ORINOCO_DOMAIN=orinoco.example.net \
            --env ORINOCO_PUBLIC_IPV4=203.0.113.10 \
            --volume "$PWD/deploy/caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.0-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile \
            2>&1 | tee "$caddy_log"
          caddy_status=${PIPESTATUS[0]}

          docker run --rm \
            --volume "$PWD/deploy/nginx/orinoco.conf.example:/etc/nginx/conf.d/orinoco.conf:ro" \
            nginx:1.28-alpine nginx -t 2>&1 | tee "$nginx_log"
          nginx_status=${PIPESTATUS[0]}

          if [ "$caddy_status" -ne 0 ] || [ "$nginx_status" -ne 0 ]; then
            echo "One or more reverse-proxy templates failed validation."
            exit 1
          fi

      - name: Upload proxy validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-validation-logs
          path: ${{ runner.temp }}/*-validation.log
          if-no-files-found: ignore

      - name: Build image (do not publish)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: orinoco-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and verify services
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs orinoco-smoke || true
            docker rm -f orinoco-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name orinoco-smoke \
            --publish 8080:8080 \
            --env 'STARTUP=supervisord -n -c /opt/orinoco/docker/supervisord.conf' \
            --env SERVER_PORT=8080 \
            --env AUTO_DOWNLOAD_MODEL=false \
            --env AI_MODEL=qwen2.5:1.5b \
            --env MODEL_CONTEXT=2048 \
            --env AI_CONCURRENCY=1 \
            orinoco-ai:ci

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Orinoco web health endpoint did not become available."
            exit 1
          fi

          docker exec orinoco-smoke python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/api/tags', timeout=5).read()"

          # Confirm the image runs unprivileged, has UK timezone data and
          # includes the encrypted backup CLI and its runtime dependencies.
          test "$(docker exec orinoco-smoke id -u)" != "0"
          docker exec orinoco-smoke python -c \
            "from zoneinfo import ZoneInfo; ZoneInfo('Europe/London')"
          docker exec orinoco-smoke python -m orinoco.backups --help >/dev/null
          docker exec orinoco-smoke python -c \
            "from pathlib import Path; import sys; sys.exit(0 if any(b'-m\\x00orinoco.backup_scheduler\\x00' in p.read_bytes() for p in Path('/proc').glob('[0-9]*/cmdline')) else 1)"

          ready_code=$(curl --silent --output /tmp/orinoco-ready.json --write-out "%{http_code}" http://127.0.0.1:8080/readyz)
          test "$ready_code" = "503"
          grep -q "model_missing" /tmp/orinoco-ready.json
