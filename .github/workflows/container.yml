name: Container build

on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "orinoco/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "docker/**"
      - "orinoco/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Orinoco container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate shell scripts
        run: for script in docker/*.sh; do sh -n "$script"; done

      - name: Build image (do not publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: orinoco-ai:ci
